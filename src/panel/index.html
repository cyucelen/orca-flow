<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body>
    <div class="topbar">
      <div id="cockpit" class="grow-bar"></div>
      <div id="searchbox" class="searchbox grow-bar" hidden>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
        <input id="search" type="search" placeholder="Find a workspace" aria-label="Find a workspace" autocomplete="off" spellcheck="false" />
        <button id="search-close" class="icon" aria-label="Close search"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg></button>
      </div>
      <span id="update-slot" class="slot"></span>
      <button id="search-open" class="icon" aria-label="Find a workspace"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg></button>
      <button id="settings-open" class="icon" aria-label="Orca Flow settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
    <div id="copen"></div>
    <section id="goals" class="gsec" aria-label="Goals" hidden>
      <div id="goals-head"></div>
      <div id="goal-add" class="add" hidden><input id="goal-new" placeholder="A goal in one sentence" aria-label="New goal" autocomplete="off" spellcheck="false" /></div>
      <div id="goals-rows" class="goals"></div>
    </section>
    <main id="main" aria-busy="true"></main>
    <section id="attention" class="attention" aria-label="Up next" hidden></section>
    <section id="bots" class="lsec bsec" aria-label="Bots" hidden></section>
    <section id="linear" class="lsec" aria-label="Linear" hidden></section>
    <section id="tokenspeed" class="lsec tsec" aria-label="Token speed" hidden></section>
    <footer id="footer"></footer>
    <div id="modal" class="modal" hidden>
      <form id="coord-form" class="sheet" role="dialog" aria-modal="true" aria-labelledby="coord-title" novalidate>
        <h2 id="coord-title">New coordinator</h2>
        <div class="look">
          <span id="coord-look" class="look-preview" aria-hidden="true"></span>
          <button type="button" id="coord-shuffle" class="shuffle" aria-label="Shuffle character">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5h2.5c3 0 4 7 7 7H14M12 9.5l2 2-2 2M2 11.5h2.5c1.2 0 2-1 2.6-2.2M9 6.7C9.6 5.5 10.4 4.5 11.5 4.5H14M12 2.5l2 2-2 2"/></svg>
          </button>
        </div>
        <input id="coord-name" class="name" autocomplete="off" spellcheck="false" placeholder="Name" maxlength="24" aria-label="Name" />
        <div id="coord-error" class="err" role="alert" hidden></div>
        <div class="actions">
          <button type="button" id="coord-cancel" class="ghost">Cancel</button>
          <button type="submit" id="coord-create" class="primary">Create</button>
        </div>
      </form>
    </div>
    <dialog id="goalpop" class="gpop" aria-label="Goal details" autofocus hidden></dialog>
    <div id="ctx" class="ctx" role="menu" tabindex="-1" hidden></div>
    <div id="toast" class="toast" role="status" hidden></div>
    <div id="confirm" class="modal" hidden>
      <form id="confirm-form" class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-text">
        <div class="dialog-body">
          <span id="confirm-icon" class="dialog-icon" aria-hidden="true"></span>
          <div class="dialog-text">
            <h2 id="confirm-title"></h2>
            <p id="confirm-text"></p>
            <label class="remember"><input type="checkbox" id="confirm-remember" />Don't ask again</label>
          </div>
        </div>
        <div class="dialog-actions">
          <button type="button" id="confirm-cancel" class="btn">Cancel</button>
          <button type="submit" id="confirm-ok" class="btn danger"></button>
        </div>
      </form>
    </div>
    <div id="settings" class="s-scrim" hidden>
      <section class="s-dialog" role="dialog" aria-modal="true" aria-labelledby="s-title" tabindex="-1">
        <header class="s-head">
          <h2 id="s-title" data-tip="Orca Flow">Settings</h2>
          <button class="s-x" id="s-x" type="button" aria-label="Close settings"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
        </header>
        <div class="s-body">
          <nav aria-label="Settings pages" id="s-nav"></nav>
          <div class="s-page" id="s-page"></div>
        </div>
      </section>
    </div>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
