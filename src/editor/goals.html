<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Completed goals</title>
    <link rel="stylesheet" href="./editor.css" />
    <link rel="stylesheet" href="./goals.css" />
  </head>
  <body class="cg">
    <div id="app"></div>
    <div id="toast-slot"></div>
    <div id="live" class="sr" aria-live="polite"></div>
    <script>
      // A failure to load or start the entry module below would leave this frame blank: say so instead.
      ;(function () {
        var errors = []
        var note = function (e) { if (e instanceof ErrorEvent || (e.target && e.target.tagName === 'SCRIPT')) errors.push(e.message || 'could not load ' + e.target.src) }
        addEventListener('error', note, true)
        addEventListener('DOMContentLoaded', function () {
          removeEventListener('error', note, true)
          if (!errors.length) return
          var p = document.createElement('p')
          p.className = 'load-failed'
          p.setAttribute('role', 'alert')
          p.style.cssText = 'margin:12px;padding:10px 12px;border:1px solid var(--orca-border,#444);border-radius:6px;font:13px/1.45 system-ui,sans-serif;color:var(--orca-foreground,#ddd);background:var(--orca-background,#1b1b1d)'
          p.textContent = 'Orca Flow could not load. Restart Orca to try again. (' + errors[0] + ')'
          document.body.prepend(p)
        })
      })()
    </script>
    <script type="module" src="./goals-main.js"></script>
  </body>
</html>
